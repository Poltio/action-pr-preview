name: Pull Request Preview
description: Creates unique preview environments for Pull Requests on Google Cloud Run
inputs:
  GOOGLE_CLOUD_PROJECT_ID:
    description: Google Cloud Project ID you want to use.
    required: true
  WORKLOAD_IDENTITY_PROVIDER:
    description: Full resource name of the Workload Identity Provider. The calling job needs id-token write permission.
    required: true
  SERVICE_ACCOUNT:
    description: Email of the service account to deploy as.
    required: true
  DOCKER_BUILD_ARGS:
    description: If you want to inject build params to docker build step.
    required: false
    default: ""
  CLOUD_RUN_SERVICE_NAME:
    description: Google Cloud Run Service name you want to deploy
    required: true
  CLOUD_RUN_REGION:
    description: The region you want your service to run
    required: true
  CLOUD_RUN_SECRETS:
    description: 'Cloud Run secrets to mount or use env vars '
    required: false
    default: ""
  CLOUD_RUN_ENV_VARS:
    description: 'Cloud Run env vars '
    required: false
    default: ""
  ARTIFACT_REGISTRY_REGION:
    description: Google Artifact Registry region you want to use
    required: true
  ARTIFACT_REGISTRY_REPO:
    description: Google artifact Registry repository you want to store your build image in
    required: true
  ARTIFACT_REGISTRY_IMAGE:
    description: Google Artifact Registry image
    required: true
outputs:
  PREVIEW_URL:
    description: The url for the preview environment.
    value: ${{ steps.deploy.outputs.url }}
runs:
  using: composite
  steps:
    - name: Add SHORT_SHA env property with commit short sha
      shell: bash
      run: | # zizmor: ignore[github-env]
        short_sha=$(echo ${GITHUB_SHA} | cut -c1-8)
        delimiter="$(openssl rand -hex 8)"
        echo "SHORT_SHA<<$delimiter" >> "$GITHUB_ENV"
        echo "$short_sha" >> "$GITHUB_ENV"
        echo "$delimiter" >> "$GITHUB_ENV"
    - name: Get url friendly branch name
      shell: bash
      run: | # zizmor: ignore[github-env]
        url=$(sed -E 's#refs/[^\/]*/##;s/[^a-zA-Z0-9]+/-/g;s/-+/-/g;s/^-*//;s/-*$//' <<<"${GITHUB_HEAD_REF}")
        tolower=${url,,}
        reduce=$(echo $tolower | cut -c -20)
        branch_url=$(echo ${reduce%-})
        delimiter="$(openssl rand -hex 8)"
        echo "BRANCH_URL<<$delimiter" >> "$GITHUB_ENV"
        echo "$branch_url" >> "$GITHUB_ENV"
        echo "$delimiter" >> "$GITHUB_ENV"
    - name: Setup Image Tag
      shell: bash
      # BRANCH_URL and SHORT_SHA are native bash variables here because they were written to $GITHUB_ENV
      run: | # zizmor: ignore[github-env]
        delimiter="$(openssl rand -hex 8)"
        echo "docker_tag<<$delimiter" >> "$GITHUB_ENV"
        echo "preview_${BRANCH_URL}_${SHORT_SHA}" >> "$GITHUB_ENV"
        echo "$delimiter" >> "$GITHUB_ENV"
    - name: Auth Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
        workload_identity_provider: ${{ inputs.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ inputs.SERVICE_ACCOUNT }}
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        project_id: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
    - name: Setup Docker Auth
      shell: bash
      env:
        REGION: ${{ inputs.ARTIFACT_REGISTRY_REGION }}
      run: gcloud --quiet auth configure-docker "${REGION}-docker.pkg.dev"
    - name: Setup AR image tag url
      shell: bash
      env:
        REGION: ${{ inputs.ARTIFACT_REGISTRY_REGION }}
        PROJECT: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
        REPO: ${{ inputs.ARTIFACT_REGISTRY_REPO }}
        IMAGE: ${{ inputs.ARTIFACT_REGISTRY_IMAGE }}
      run: | # zizmor: ignore[github-env]
        delimiter="$(openssl rand -hex 8)"
        echo "ar_image_tag<<$delimiter" >> "$GITHUB_ENV"
        echo "${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${IMAGE}:${docker_tag}" >> "$GITHUB_ENV"
        echo "$delimiter" >> "$GITHUB_ENV"
    - name: Build the Docker Image
      shell: bash
      env:
        BUILD_ARGS: ${{ inputs.DOCKER_BUILD_ARGS }}
        # Cloud Run runs amd64 and the self-hosted runner is arm64; a --platform in BUILD_ARGS still wins
        DOCKER_DEFAULT_PLATFORM: linux/amd64
      run: |
        # builds on the runner's own Docker daemon, whose layer cache carries over between jobs.
        # --provenance=false keeps the pushed artifact a plain manifest; attestations would
        # make it an index and surprise consumers.
        # $BUILD_ARGS is deliberately unquoted so callers can pass multiple flags; set -f stops globbing.
        set -f
        docker build --tag "$ar_image_tag" --build-arg version="$docker_tag" --provenance=false $BUILD_ARGS .
    - name: Scan the image for fixable critical vulnerabilities
      shell: bash
      run: |
        # Trivy runs from its image, so any runner with Docker works. Pinned by digest: Trivy's
        # own tags were hijacked in March 2026 (GHSA-69fq-xp46-6x23).
        # The trivy-cache volume keeps the vulnerability DB between jobs on a self-hosted runner.
        # --image-src docker scans the local build and never pulls from the registry.
        # A .trivyignore in the caller's checkout is picked up through -w /src.
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v trivy-cache:/root/.cache/trivy \
          -v "$PWD:/src:ro" -w /src \
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
          image --image-src docker --severity CRITICAL --ignore-unfixed --exit-code 1 "$ar_image_tag"
    - name: Push the Image to Google Artifact Registry
      shell: bash
      run: docker push "$ar_image_tag"
    - id: deploy
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
      with:
        service: ${{ inputs.CLOUD_RUN_SERVICE_NAME }}
        image: ${{ env.ar_image_tag }}
        tag: ${{ env.BRANCH_URL }}
        region: ${{ inputs.CLOUD_RUN_REGION }}
        env_vars: ${{ inputs.CLOUD_RUN_ENV_VARS }}
        secrets: ${{ inputs.CLOUD_RUN_SECRETS }}
    - name: Comment the Link on Pull Request
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      continue-on-error: true
      env:
        DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const script = require(`${process.env.ACTION_PATH}/comment-pr.js`);
          await script({github, context});
